<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- PCs with ~100 ppi monitors at scale 1 (e.g. a 27" 1440p next to a 27" 5K).
     Light hinting (vertical only) keeps text crisp at scale 1. Chromium/Brave and
     GTK4 ignore hinting at scale 2, so a 5K screen still renders like the Retina Macs.
     Linked as common/fontconfig/local.conf by amd64/install.sh; not used on the Macs. -->
<fontconfig>
  <match target="font">
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <!-- Vertical subpixel order for the Dell rotated 90° clockwise (R-G-B top to
         bottom). Global: the ASUS gets it too, but at 5K the direction isn't visible. -->
    <edit name="rgba"      mode="assign"><const>vrgb</const></edit>
  </match>
</fontconfig>
