# The Samson Meteor USB mic has a headphone output that PipeWire picks as the default
# speaker. Hide it: the mic stays an input; audio goes to the 3.5mm jack / other outputs.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Samson_Technologies_Samson_Meteor_Mic.*" }
    ]
    actions = {
      update-props = { node.disabled = true }
    }
  }
]
