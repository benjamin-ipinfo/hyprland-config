# The EMEET SmartCam C950's built-in microphone: disabled, the dedicated USB mic is used.
# Only its ALSA audio device; the camera image (V4L2/libcamera) is unaffected.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Sonix_Technology_Co.__Ltd._EMEET_SmartCam_C950.*" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
