# hyprlock — lock screen (Super+L, idle, lid/suspend)
general {
    hide_cursor = true
}

animations {
    enabled = false   # no fade in/out
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

label {
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(212, 212, 212, 1.0)
    position = 0, 150
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(90, 90, 90, 1.0)
    inner_color = rgba(38, 38, 38, 0.9)
    font_color = rgba(212, 212, 212, 1.0)
    placeholder_text = password
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}
