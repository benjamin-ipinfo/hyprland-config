<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 227 ppi Retina panel (RGB stripe): no hinting (true glyph shapes; Chromium ignores
     hinting at scale > 1 anyway) + subpixel RGB antialiasing: gives full-weight strokes.
     Grayscale AA looked too light/thin in Chromium (tested side by side). -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="rgba"      mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <!-- Per machine, not in git: PCs link local.conf -> lowdpi-hinting.conf (install.sh) -->
  <include ignore_missing="yes" prefix="xdg">fontconfig/local.conf</include>

  <!-- Websites ask for Apple/Windows fonts we don't have. Map them to good
       on-screen fonts instead of the URW "Nimbus" print clones. -->
  <alias binding="same"><family>Inter</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter Variable</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
